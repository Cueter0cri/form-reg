<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма входа</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <input type="checkbox" id="check">
        <div class="login form">
            <header>Вход</header>
            <form action="#">
                <input type="email" required="" placeholder="Введите вашу почту">
                    <div class="container-pass">
                        <input type="password" id="password-input" placeholder="Введите пароль" name="password" required="" maxlength="16" minlength="6">
                        <img src="./icons/slash_eye.svg" alt onclick="return show_hide_password('password-input');">
                    </div>
                    <a href="#">Забыли пароль</a>
                    <input type="button" class="button" value="Войти">
            </form>
            <div class="sign-up">
                <span class="text-sign-up">
                    "У вас нет аккаунта?"
                    <br>
                    <label for="check">Зарегистрироваться</label>
                </span>
            </div>
        </div>
        <div class="reg form">
            <header>Зарегистрироваться</header>
            <form action="#">
                <input type="email" placeholder="Введите вашу почту">
                <div class="container-pass">
                    <input type="password" id="password-input2" placeholder="Введите пароль" name="password" required="" maxlength="16" minlength="6">
                    <img src="./icons/slash_eye.svg" alt onclick="return show_hide_password('password-input2');">
                </div>
                <div class="container-pass">
                    <input type="password" id="password-input3" placeholder="Введите пароль" name="password" required="" maxlength="16" minlength="6">
                    <img src="./icons/slash_eye.svg" alt="" onclick="return show_hide_password('password-input3');">
                </div>
                <div class="container-pass">
                    <input type="tel" id="phone" placeholder = "+7(___) ___-__-__" required>
                    <!-- <input type="phone-number" id="phone-input" placeholder="Введите номер телефона" name="phone-number" required="" maxlength="16" minlength="6"> -->
                </div>
                <input type="button" class="button" value="Зарегистрироваться">
            </form>
            <div class="sign-up">
                <span class="text-sign-up">
                    "У вас уже есть аккаунт?"
                    <br>
                    <label for="check">Войти</label>
                </span>
            </div>
        </div>
    </div>
    <script src="./imask.js"></script>
    <script src="./script.js"></script>
</body>
</html>
